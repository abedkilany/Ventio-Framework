name: ventio_native_client
description: Native Flutter offline-first client proof for the Ventio Framework.
publish_to: none
version: 0.1.17+18

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  crypto: 3.0.6
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.13.1
  printing: ^5.15.1
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  win32: 6.4.0
  ventio_core:
    path: ../ventio_core

dev_dependencies:
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  postgres: ^3.5.20
  ventio_host:
    path: ../ventio_host
  ventio_host_api:
    path: ../ventio_host_api
  ventio_postgres:
    path: ../ventio_postgres

flutter:
  uses-material-design: true
