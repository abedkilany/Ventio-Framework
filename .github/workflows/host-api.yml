name: Ventio Host API
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ventio
          POSTGRES_PASSWORD: ventio_test_only
          POSTGRES_DB: ventio_host_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/ventio_host_api
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - run: dart run test/api_tests.dart
      - name: Install database security profile in disposable PostgreSQL
        env:
          VENTIO_DATABASE_URL: postgresql://ventio:ventio_test_only@localhost:5432/ventio_host_test?sslmode=disable
          VENTIO_MIGRATIONS_DIR: ../../migrations/postgres
          PGPASSWORD: ventio_test_only
        run: |
          dart run ../ventio_postgres/bin/migrate.dart
          psql -h localhost -U ventio -d ventio_host_test -v expected_database=ventio_host_test -f ../../security/postgres/bootstrap.sql
          psql -h localhost -U ventio -d ventio_host_test -f ../../security/postgres/test_logins.sql
      - name: Run isolated HTTP and PostgreSQL integration tests
        env:
          VENTIO_TEST_DATABASE_URL: postgresql://ventio:ventio_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_ALLOW_DATABASE_TESTS: 'yes'
        run: dart run test/api_integration.dart
      - name: Run persistent identity and revocation integration tests
        env:
          VENTIO_TEST_DATABASE_URL: postgresql://ventio:ventio_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_ALLOW_DATABASE_TESTS: 'yes'
          VENTIO_TEST_RUNTIME_DATABASE_URL: postgresql://ventio_runtime_test:runtime_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_TEST_ADMIN_DATABASE_URL: postgresql://ventio_admin_test:admin_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
        run: dart run test/identity_integration.dart
      - name: Run direct SQL, least-privilege and RLS isolation tests
        env:
          VENTIO_TEST_DATABASE_URL: postgresql://ventio:ventio_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_TEST_RUNTIME_DATABASE_URL: postgresql://ventio_runtime_test:runtime_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_TEST_ADMIN_DATABASE_URL: postgresql://ventio_admin_test:admin_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_TEST_MIGRATION_DATABASE_URL: postgresql://ventio_migration_test:migration_test_only@localhost:5432/ventio_host_test?sslmode=disable&connect_timeout=5&query_timeout=20
          VENTIO_ALLOW_DATABASE_TESTS: 'yes'
        run: dart run test/database_security_integration.dart
