name: Isolated Wave 2 B hosted acceptance
on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: all
      candidate_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  windows-candidate:
    if: inputs.scope == 'all' || inputs.scope == 'windows' || inputs.scope == 'windows-tests'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VENTIO_WAVE2_PREPARED_TESTS: 'yes'
      VENTIO_PRIVATE_FILES_DIAGNOSTICS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stage fresh SHA-256-pinned tools; capture hosted provenance
        if: inputs.scope != 'windows-tests'
        run: ./scripts/ci/stage-wave2-acceptance.ps1
      - name: Initialize unexecuted case ledger
        run: python tests/wave2/run_hosted_tests.py initialize
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: inputs.scope != 'windows-tests'
        with:
          dotnet-version: '8.0.421'
      - name: Build Host before Flutter changes Dart PATH
        if: inputs.scope != 'windows-tests'
        run: |
          Push-Location packages/ventio_host_api
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE) { throw 'Host dependency resolution failed' }
          Pop-Location
          Push-Location packages/ventio_postgres
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE) { throw 'Migration dependency resolution failed' }
          Pop-Location
          ./scripts/ci/install-postgres-tools.ps1
          $pg = Join-Path $env:RUNNER_TOOL_CACHE 'ventio-postgresql-16.15-5-x64/pgsql/bin'
          ./scripts/windows/build-host-payload.ps1 -PostgresBinDirectory $pg
      - uses: subosito/flutter-action@3d804929922b667a63a229bc59037807f969e885 # v2.15.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: false
      - name: Build Client and unified installer from this checkout only
        if: inputs.scope != 'windows-tests'
        run: |
          ./scripts/prepare_native_client_platforms.ps1
          Push-Location packages/ventio_native_client
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { throw 'Client dependency resolution failed' }
          flutter build windows --release
          if ($LASTEXITCODE) { throw 'Client release build failed' }
          Pop-Location
          ./scripts/windows/build-windows-installer.ps1 -SkipFlutterBuild -VCRedistPath "$env:RUNNER_TEMP/wave2-inputs/vc_redist.x64.exe" -InstallerOutputDirectory "$env:RUNNER_TEMP/wave2-installer"
      - name: Package complete candidate, manifests, source and security evidence
        if: inputs.scope != 'windows-tests'
        run: ./scripts/ci/package-wave2-acceptance.ps1
      - name: Resolve only prerequisites for selected Windows test reruns
        if: inputs.scope == 'windows-tests'
        run: |
          ./scripts/prepare_native_client_platforms.ps1
          Push-Location packages/ventio_native_client
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { throw 'Flutter test dependencies failed' }
          Pop-Location
          Push-Location packages/ventio_host_api
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE) { throw 'Host fixture dependencies failed' }
          Pop-Location
          ./scripts/ci/install-postgres-tools.ps1
          $flutterRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          "VENTIO_HOST_DART_BIN=$flutterRoot/bin/cache/dart-sdk/bin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare actual private Windows fixture storage
        working-directory: packages/ventio_host_api
        run: |
          & "$env:VENTIO_HOST_DART_BIN/dart.exe" --packages=.dart_tool/package_config.json test/prepare_private_test_storage.dart
          if ($LASTEXITCODE) { throw 'Private fixture storage failed production ACL verification' }
      - name: Execute Core, SQLite and Windows integrity cases
        continue-on-error: true
        run: python tests/wave2/run_hosted_tests.py ${{ inputs.scope == 'windows-tests' && 'windows-recovery' || 'windows' }}
      - name: Prepare separate disposable PostgreSQL for desktop integration
        run: ./scripts/ci/start-postgres-test-instance.ps1
      - name: Execute native desktop cases against the real fixture
        continue-on-error: true
        run: python tests/wave2/run_hosted_tests.py desktop
      - name: Stop only this runner's disposable PostgreSQL
        if: always()
        run: |
          if ($env:VENTIO_TEST_POSTGRES_DATA_DIRECTORY) { ./scripts/ci/stop-postgres-test-instance.ps1 }
      - name: Retain immutable candidate and case-level evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave2-hosted-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wave2-delivery/*
            ${{ github.workspace }}/test-results/wave2/*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce applicable Windows results
        if: always()
        run: python tests/wave2/run_hosted_tests.py ${{ inputs.scope == 'windows-tests' && 'verify-windows-recovery' || 'verify-windows' }}
  linux-integration:
    if: inputs.scope == 'all' || inputs.scope == 'linux' || inputs.scope == 'gateway-jobs' || inputs.scope == 'core'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.13.7'
      - name: Initialize unexecuted case ledger
        run: python3 tests/wave2/run_hosted_tests.py initialize
      - name: Resolve locked Host dependencies and prepare restricted audit helper
        run: |
          set -euo pipefail
          cd packages/ventio_host_api
          dart pub get --enforce-lockfile
          cd ../ventio_postgres
          dart pub get --enforce-lockfile
          cd ../..
          bash scripts/ci/install-ventio-ci-drop-helper.sh
          docker pull postgres:16.15-bookworm
          docker tag postgres:16.15-bookworm postgres:16
      - name: Execute real PostgreSQL, gateway, jobs, upgrade and WB-CI-02 cases
        continue-on-error: true
        run: python3 tests/wave2/run_hosted_tests.py ${{ inputs.scope == 'core' && 'core' || (inputs.scope == 'gateway-jobs' && 'gateway-jobs' || 'linux') }}
      - uses: subosito/flutter-action@3d804929922b667a63a229bc59037807f969e885 # v2.15.0
        if: inputs.scope != 'gateway-jobs' && inputs.scope != 'core'
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: false
      - name: Resolve locked Flutter dependencies
        if: inputs.scope != 'gateway-jobs' && inputs.scope != 'core'
        working-directory: packages/ventio_native_client
        run: flutter pub get --enforce-lockfile
      - name: Execute two-queue offline integration with real PostgreSQL and HTTP
        if: inputs.scope != 'gateway-jobs' && inputs.scope != 'core'
        continue-on-error: true
        run: python3 tests/wave2/run_hosted_tests.py offline
      - name: Retain case-level integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave2-hosted-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/wave2/*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce applicable Linux results
        if: always()
        run: python3 tests/wave2/run_hosted_tests.py ${{ inputs.scope == 'core' && 'verify-core' || (inputs.scope == 'gateway-jobs' && 'verify-gateway-jobs' || 'verify-linux') }}
  protected-candidate-verification:
    if: inputs.scope == 'verify-candidate'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the hosted artifact and verify all package bytes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python tests/wave2/download_hosted_candidate.py $env:CANDIDATE_RUN_ID
      - name: Enable protection normally, scan, and test fresh Client-only installer rollback
        shell: pwsh
        run: ./scripts/ci/verify-wave2-protected-candidate.ps1
      - name: Retain independent protection and installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave2-protected-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wave2-protected-evidence/*
          if-no-files-found: error
          retention-days: 30
