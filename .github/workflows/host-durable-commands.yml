name: Ventio Durable Commands

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-durable-commands.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_host/**'
      - 'packages/ventio_postgres/**'
      - 'migrations/postgres/**'
      - 'scripts/ci/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/host-durable-commands.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_host/**'
      - 'packages/ventio_postgres/**'
      - 'migrations/postgres/**'
      - 'scripts/ci/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  durable-commands:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/ventio_host
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Cache Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: windows-pub-${{ hashFiles('packages/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze .
      - name: Install verified PostgreSQL 16 test tools
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\install-postgres-tools.ps1
      - name: Start private PostgreSQL 16 test instance
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\start-postgres-test-instance.ps1
      - name: Run durable PostgreSQL command integration tests
        run: dart run test/durable_integration.dart
      - name: Remove disposable PostgreSQL test instance
        if: always()
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\stop-postgres-test-instance.ps1
