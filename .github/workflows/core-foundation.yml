name: Ventio Core Foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-foundation.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'spec/**'
      - 'scripts/verify_package.py'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-foundation.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'spec/**'
      - 'scripts/verify_package.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart-core:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ventio_core
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Cache Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: windows-pub-${{ hashFiles('packages/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - run: dart run test/all_tests.dart
      - run: dart run bin/maintenance_demo.dart
      - run: dart run bin/two_module_demo.dart

  architecture-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify the runner's Python runtime
        run: python --version
      - name: Install isolated contract dependencies
        run: |
          python -m pip install --upgrade --disable-pip-version-check --target "%RUNNER_TEMP%\ventio-python-packages" "jsonschema>=4.18,<5"
          echo PYTHONPATH=%RUNNER_TEMP%\ventio-python-packages>>"%GITHUB_ENV%"
      - run: python scripts/verify_package.py
      - run: python spec/v1.2/scripts/validate_contracts.py
      - run: python -m unittest discover -s spec/v1.2/tests -v
      - run: python -m unittest discover -s tests -v
