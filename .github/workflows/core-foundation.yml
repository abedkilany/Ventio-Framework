name: Ventio Core Foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-foundation.yml'
      - 'packages/ventio_core/**'
      - 'spec/**'
      - 'scripts/verify_package.py'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-foundation.yml'
      - 'packages/ventio_core/**'
      - 'spec/**'
      - 'scripts/verify_package.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart-core:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.actor == 'abedkilany' && github.event.pull_request.user.login == 'abedkilany' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.actor == 'abedkilany' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/windows-self-hosted-runner'))
    runs-on: [self-hosted, Windows, X64, ventio-windows]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ventio_core
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Add the verified Dart SDK to PATH
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\install-dart-sdk.ps1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - run: dart run test/all_tests.dart
      - run: dart run bin/maintenance_demo.dart
      - run: dart run bin/two_module_demo.dart

  architecture-contracts:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.actor == 'abedkilany' && github.event.pull_request.user.login == 'abedkilany' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.actor == 'abedkilany' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/windows-self-hosted-runner'))
    runs-on: [self-hosted, Windows, X64, ventio-windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the runner's Python runtime
        run: C:\Python314\python.exe --version
      - name: Install isolated contract dependencies
        run: |
          C:\Python314\python.exe -m pip install --upgrade --disable-pip-version-check --target "%RUNNER_TEMP%\ventio-python-packages" "jsonschema>=4.18,<5"
          echo PYTHONPATH=%RUNNER_TEMP%\ventio-python-packages>>"%GITHUB_ENV%"
      - run: C:\Python314\python.exe scripts/verify_package.py
      - run: C:\Python314\python.exe spec/v1.2/scripts/validate_contracts.py
      - run: C:\Python314\python.exe -m unittest discover -s spec/v1.2/tests -v
      - run: C:\Python314\python.exe -m unittest discover -s tests -v
