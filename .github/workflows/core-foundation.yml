name: Ventio Core Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ci_run_scope:
        required: false
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ci_run_scope || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  select-changes:
    uses: ./.github/workflows/ci-change-selector.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      event_name: ${{ github.event_name }}
      event_action: ${{ github.event.action || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      before_sha: ${{ github.event.before || '' }}
      pr_number: ${{ github.event.pull_request.number || 0 }}
      ref_name: ${{ github.event.pull_request.head.ref || github.ref_name }}
      ci_force_full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
      ci_run_scope: ${{ inputs.ci_run_scope || '' }}
  dart-core-suite:
    needs: select-changes
    if: needs.select-changes.outputs.run_core_foundation == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ventio_core
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Cache Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: windows-pub-${{ hashFiles('packages/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - run: dart run test/all_tests.dart
      - run: dart run bin/maintenance_demo.dart
      - run: dart run bin/two_module_demo.dart

  architecture-contracts-suite:
    needs: select-changes
    if: needs.select-changes.outputs.run_core_foundation == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify the runner's Python runtime
        run: python --version
      - name: Install isolated contract dependencies
        run: |
          python -m pip install --upgrade --disable-pip-version-check --target "%RUNNER_TEMP%\ventio-python-packages" "jsonschema>=4.18,<5"
          echo PYTHONPATH=%RUNNER_TEMP%\ventio-python-packages>>"%GITHUB_ENV%"
      - run: python scripts/verify_package.py
      - run: python spec/v1.2/scripts/validate_contracts.py
      - run: python -m unittest discover -s spec/v1.2/tests -v
      - run: python -m unittest discover -s tests -v
  dart-core:
    needs: [select-changes, dart-core-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check context and report suite result
        env:
          SELECTOR_RESULT: ${{ needs.select-changes.result }}
          SHOULD_RUN: ${{ needs.select-changes.outputs.run_core_foundation }}
          SUITE_RESULT: ${{ needs.dart-core-suite.result }}
        run: |
          if [[ "$SELECTOR_RESULT" != "success" ]]; then
            echo "CI change selection or documentation validation failed." >&2
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$SUITE_RESULT" != "success" ]]; then
            echo "The selected verification suite did not succeed (result: $SUITE_RESULT)." >&2
            exit 1
          fi
          echo "Required check passed; selected suite result: $SUITE_RESULT."

  architecture-contracts:
    needs: [select-changes, architecture-contracts-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check context and report suite result
        env:
          SELECTOR_RESULT: ${{ needs.select-changes.result }}
          SHOULD_RUN: ${{ needs.select-changes.outputs.run_core_foundation }}
          SUITE_RESULT: ${{ needs.architecture-contracts-suite.result }}
        run: |
          if [[ "$SELECTOR_RESULT" != "success" ]]; then
            echo "CI change selection or documentation validation failed." >&2
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$SUITE_RESULT" != "success" ]]; then
            echo "The selected verification suite did not succeed (result: $SUITE_RESULT)." >&2
            exit 1
          fi
          echo "Required check passed; selected suite result: $SUITE_RESULT."
