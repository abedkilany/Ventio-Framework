name: Ventio Credential Lifecycle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ci_run_scope:
        required: false
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ci_run_scope || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  select-changes:
    uses: ./.github/workflows/ci-change-selector.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      event_name: ${{ github.event_name }}
      event_action: ${{ github.event.action || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      before_sha: ${{ github.event.before || '' }}
      pr_number: ${{ github.event.pull_request.number || 0 }}
      ref_name: ${{ github.event.pull_request.head.ref || github.ref_name }}
      ci_force_full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
      ci_run_scope: ${{ inputs.ci_run_scope || '' }}
  credential-lifecycle-suite:
    needs: select-changes
    if: needs.select-changes.outputs.run_credential_lifecycle == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/ventio_host_api
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Cache Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: windows-pub-${{ hashFiles('packages/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.404'
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - name: Prepare and verify private Windows test storage
        env:
          VENTIO_PRIVATE_FILES_DIAGNOSTICS: '1'
        run: powershell.exe -NoLogo -NoProfile -File ..\..\scripts\ci\run-windows-dart-test.ps1 run test/prepare_private_test_storage.dart
      - name: Install verified PostgreSQL 16 test tools
        run: powershell.exe -NoLogo -NoProfile -File ..\..\scripts\ci\install-postgres-tools.ps1
      - name: Start private PostgreSQL 16 test instance
        run: powershell.exe -NoLogo -NoProfile -File ..\..\scripts\ci\start-postgres-test-instance.ps1
      - name: Prepare disposable least-privilege database
        env:
          VENTIO_MIGRATIONS_DIR: ../../migrations/postgres
          PGPASSWORD: ventio_test_only
        run: |
          dart run ../ventio_postgres/bin/migrate.dart
          psql -X -h 127.0.0.1 -p %VENTIO_TEST_POSTGRES_PORT% -U ventio -d ventio_host_test -v ON_ERROR_STOP=1 -v expected_database=ventio_host_test -f ..\..\security\postgres\bootstrap.sql
          psql -X -h 127.0.0.1 -p %VENTIO_TEST_POSTGRES_PORT% -U ventio -d ventio_host_test -f ..\..\security\postgres\test_logins.sql
      - name: Verify provisioning, concurrent rotation, forced crashes and recovery admission
        env:
          VENTIO_PRIVATE_FILES_DIAGNOSTICS: '1'
        run: powershell.exe -NoLogo -NoProfile -File ..\..\scripts\ci\run-windows-dart-test.ps1 run test/lifecycle_integration.dart
      - name: Remove disposable PostgreSQL test instance
        if: always()
        run: powershell.exe -NoLogo -NoProfile -File ..\..\scripts\ci\stop-postgres-test-instance.ps1
  credential-lifecycle:
    needs: [select-changes, credential-lifecycle-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check context and report suite result
        env:
          SELECTOR_RESULT: ${{ needs.select-changes.result }}
          SHOULD_RUN: ${{ needs.select-changes.outputs.run_credential_lifecycle }}
          SUITE_RESULT: ${{ needs.credential-lifecycle-suite.result }}
        run: |
          if [[ "$SELECTOR_RESULT" != "success" ]]; then
            echo "CI change selection or documentation validation failed." >&2
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$SUITE_RESULT" != "success" ]]; then
            echo "The selected verification suite did not succeed (result: $SUITE_RESULT)." >&2
            exit 1
          fi
          echo "Required check passed; selected suite result: $SUITE_RESULT."
