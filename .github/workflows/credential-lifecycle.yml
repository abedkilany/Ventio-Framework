name: Ventio Credential Lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/credential-lifecycle.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_host/**'
      - 'packages/ventio_host_api/**'
      - 'packages/ventio_postgres/**'
      - 'migrations/postgres/**'
      - 'security/postgres/**'
      - 'spec/v1.2/examples/**'
      - 'scripts/ci/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/credential-lifecycle.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_host/**'
      - 'packages/ventio_host_api/**'
      - 'packages/ventio_postgres/**'
      - 'migrations/postgres/**'
      - 'security/postgres/**'
      - 'spec/v1.2/examples/**'
      - 'scripts/ci/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/ventio_host_api
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Cache Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: windows-pub-${{ hashFiles('packages/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze .
      - name: Prepare and verify private Windows test storage
        env:
          VENTIO_PRIVATE_FILES_DIAGNOSTICS: '1'
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\run-windows-dart-test.ps1 run test/prepare_private_test_storage.dart
      - name: Install verified PostgreSQL 16 test tools
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\install-postgres-tools.ps1
      - name: Start private PostgreSQL 16 test instance
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\start-postgres-test-instance.ps1
      - name: Prepare disposable least-privilege database
        env:
          VENTIO_MIGRATIONS_DIR: ../../migrations/postgres
          PGPASSWORD: ventio_test_only
        run: |
          dart run ../ventio_postgres/bin/migrate.dart
          psql -X -h 127.0.0.1 -p %VENTIO_TEST_POSTGRES_PORT% -U ventio -d ventio_host_test -v ON_ERROR_STOP=1 -v expected_database=ventio_host_test -f ..\..\security\postgres\bootstrap.sql
          psql -X -h 127.0.0.1 -p %VENTIO_TEST_POSTGRES_PORT% -U ventio -d ventio_host_test -f ..\..\security\postgres\test_logins.sql
      - name: Verify provisioning, concurrent rotation, forced crashes and recovery admission
        env:
          VENTIO_PRIVATE_FILES_DIAGNOSTICS: '1'
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\run-windows-dart-test.ps1 run test/lifecycle_integration.dart
      - name: Remove disposable PostgreSQL test instance
        if: always()
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\..\scripts\ci\stop-postgres-test-instance.ps1
