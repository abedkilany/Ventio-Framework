name: Ventio Windows Self-hosted Runner Smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  runner-smoke:
    if: github.ref == 'refs/heads/codex/windows-self-hosted-runner' && github.actor == 'abedkilany'
    runs-on: [self-hosted, Windows, X64, ventio-windows]
    timeout-minutes: 3
    steps:
      - name: Verify runner identity and platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'Ventio-Windows-Runner') { throw "Unexpected runner name: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Unexpected runner OS: $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Unexpected runner architecture: $env:RUNNER_ARCH" }
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Platform: $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "Work directory: $env:RUNNER_WORKSPACE"
