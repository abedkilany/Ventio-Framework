name: Native Flutter Client and Extension Builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-flutter-client.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_native_client/**'
      - 'scripts/prepare_native_client_platforms.ps1'
      - 'scripts/ci/**'
      - 'scripts/ci_android/**'
      - 'scripts/check_localization_gate.py'
      - 'scripts/test_check_localization_gate.py'
      - 'spec/v1.2/examples/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-flutter-client.yml'
      - '.github/workflows/host-api.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_native_client/**'
      - 'scripts/prepare_native_client_platforms.ps1'
      - 'scripts/ci/**'
      - 'scripts/ci_android/**'
      - 'scripts/check_localization_gate.py'
      - 'scripts/test_check_localization_gate.py'
      - 'spec/v1.2/examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-client-windows-android:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Set up pinned Flutter SDK and cache dependencies
        uses: subosito/flutter-action@v2.15.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
          pub-cache: true
      - name: Generate native runner scaffolding
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\prepare_native_client_platforms.ps1
      - name: Resolve dependencies
        working-directory: packages/ventio_native_client
        run: flutter pub get --enforce-lockfile
      - name: Install isolated contract validation dependency
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "ventio-python-packages-$env:GITHUB_RUN_ID"
          python -m pip install --disable-pip-version-check --target $packageRoot 'jsonschema>=4.18,<5'
          "PYTHONPATH=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate contract examples
        run: python scripts/validate_contracts.py
      - name: Enforce localization gate
        run: python scripts/check_localization_gate.py
      - name: Test localization gate
        run: python -m unittest scripts.test_check_localization_gate
      - name: Check formatting and static analysis
        working-directory: packages/ventio_native_client
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
      - name: Test Extension Builder, local data engine and command queue
        working-directory: packages/ventio_native_client
        run: flutter test --reporter expanded
      - name: Run native Windows Extension Builder acceptance
        working-directory: packages/ventio_native_client
        run: flutter test integration_test/extension_builder_app_test.dart -d windows --no-pub --reporter expanded
      - name: Build Windows desktop app
        working-directory: packages/ventio_native_client
        run: flutter build windows --debug
      - name: Build Windows release app
        working-directory: packages/ventio_native_client
        run: flutter build windows --release
      - name: Build Android debug APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --debug
      - name: Build Android release APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --release
