name: Native Flutter Client and Extension Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ci_run_scope:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      wave2_resume:
        description: Only the isolated Wave 2 B acceptance build and prepared suites
        type: boolean
        default: false
      wave2_scope:
        description: Targeted rerun scope
        type: choice
        options: [all, linux, windows, gateway-jobs, windows-tests, windows-gui, windows-runtime, windows-pg-minor, core, verify-candidate, candidate-evidence, recovery-admission]
        default: all
      candidate_run_id:
        description: Existing hosted candidate run for protected verification
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ci_run_scope || github.event.pull_request.number || github.ref }}-${{ inputs.wave2_scope || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  select-changes:
    if: ${{ !inputs.wave2_resume }}
    uses: ./.github/workflows/ci-change-selector.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      event_name: ${{ github.event_name }}
      event_action: ${{ github.event.action || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      before_sha: ${{ github.event.before || '' }}
      pr_number: ${{ github.event.pull_request.number || 0 }}
      ref_name: ${{ github.event.pull_request.head.ref || github.ref_name }}
      ci_force_full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
      ci_run_scope: ${{ inputs.ci_run_scope || '' }}
  native-client-windows-android-suite:
    needs: select-changes
    if: needs.select-changes.outputs.run_native_client == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Set up pinned Flutter SDK and cache dependencies
        uses: subosito/flutter-action@v2.15.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
          pub-cache: true
      - name: Generate native runner scaffolding
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\prepare_native_client_platforms.ps1
      - name: Resolve dependencies
        working-directory: packages/ventio_native_client
        run: flutter pub get --enforce-lockfile
      - name: Install isolated contract validation dependency
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "ventio-python-packages-$env:GITHUB_RUN_ID"
          python -m pip install --disable-pip-version-check --target $packageRoot 'jsonschema>=4.18,<5'
          "PYTHONPATH=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate contract examples
        run: python scripts/validate_contracts.py
      - name: Enforce localization gate
        run: python scripts/check_localization_gate.py
      - name: Test localization gate
        run: python -m unittest scripts.test_check_localization_gate
      - name: Check formatting and static analysis
        working-directory: packages/ventio_native_client
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
      - name: Test Extension Builder, local data engine and command queue
        working-directory: packages/ventio_native_client
        run: flutter test --reporter expanded
      - name: Run native Windows Extension Builder acceptance
        working-directory: packages/ventio_native_client
        run: flutter test integration_test/extension_builder_app_test.dart -d windows --no-pub --reporter expanded
      - name: Build Windows desktop app
        working-directory: packages/ventio_native_client
        run: flutter build windows --debug
      - name: Build Windows release app
        working-directory: packages/ventio_native_client
        run: flutter build windows --release
      - name: Build Android debug APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --debug
      - name: Build Android release APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --release
  native-client-windows-android:
    needs: [select-changes, native-client-windows-android-suite]
    if: ${{ always() && !inputs.wave2_resume }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check context and report suite result
        env:
          SELECTOR_RESULT: ${{ needs.select-changes.result }}
          SHOULD_RUN: ${{ needs.select-changes.outputs.run_native_client }}
          SUITE_RESULT: ${{ needs.native-client-windows-android-suite.result }}
        run: |
          if [[ "$SELECTOR_RESULT" != "success" ]]; then
            echo "CI change selection or documentation validation failed." >&2
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$SUITE_RESULT" != "success" ]]; then
            echo "The selected verification suite did not succeed (result: $SUITE_RESULT)." >&2
            exit 1
          fi
          echo "Required check passed; selected suite result: $SUITE_RESULT."

  wave2-resume:
    if: github.event_name == 'workflow_dispatch' && inputs.wave2_resume
    uses: ./.github/workflows/wave2-b-hosted-resume.yml
    with:
      scope: ${{ inputs.wave2_scope || 'all' }}
      candidate_run_id: ${{ inputs.candidate_run_id || '' }}
    permissions:
      contents: read
      actions: read
