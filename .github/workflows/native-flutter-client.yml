name: Native Flutter Client and Extension Builder

on:
  push:
    branches:
      - feature/native-flutter-offline-proof
      - 'codex/**'
    paths:
      - '.github/workflows/native-flutter-client.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_native_client/**'
      - 'scripts/prepare_native_client_platforms.*'
      - 'spec/v1.2/examples/**'
  pull_request:
    paths:
      - '.github/workflows/native-flutter-client.yml'
      - 'packages/ventio_core/**'
      - 'packages/ventio_native_client/**'
      - 'scripts/prepare_native_client_platforms.*'
      - 'spec/v1.2/examples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Generate native runner scaffolding
        run: ./scripts/prepare_native_client_platforms.sh
      - name: Resolve dependencies
        working-directory: packages/ventio_native_client
        run: flutter pub get
      - name: Check formatting and static analysis
        working-directory: packages/ventio_native_client
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
      - name: Test Extension Builder, local data engine and command queue
        working-directory: packages/ventio_native_client
        run: flutter test --reporter expanded

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Generate native runner scaffolding
        shell: pwsh
        run: ./scripts/prepare_native_client_platforms.ps1
      - name: Resolve dependencies
        working-directory: packages/ventio_native_client
        run: flutter pub get
      - name: Run native Windows Extension Builder acceptance
        working-directory: packages/ventio_native_client
        run: flutter test integration_test/extension_builder_app_test.dart -d windows --no-pub --reporter expanded
      - name: Build Windows desktop app
        working-directory: packages/ventio_native_client
        run: flutter build windows --debug
      - name: Build Windows release app
        working-directory: packages/ventio_native_client
        run: flutter build windows --release

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Generate native runner scaffolding
        run: ./scripts/prepare_native_client_platforms.sh
      - name: Resolve dependencies
        working-directory: packages/ventio_native_client
        run: flutter pub get
      - name: Build Android debug APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --debug
      - name: Build Android release APK
        working-directory: packages/ventio_native_client
        run: flutter build apk --release
