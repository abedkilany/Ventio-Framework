name: Host Security Investigation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/host-security-investigation.yml'
      - 'scripts/ci/investigate-host-binary.ps1'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        with:
          sdk: 3.13.7
      - name: Reproduce frozen Host and collect Defender evidence without executing Host
        shell: pwsh
        run: ./scripts/ci/investigate-host-binary.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-security-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ventio-host-security/evidence/*
          if-no-files-found: error
          retention-days: 30
